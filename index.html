<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NUMBER46 | コンセプトカフェ 新宿歌舞伎町</title>
<link rel="preconnect" href="[fonts.googleapis.com](https://fonts.googleapis.com)">
<link rel="preconnect" href="[fonts.gstatic.com](https://fonts.gstatic.com)" crossorigin>
<link href="[fonts.googleapis.com](https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Noto+Serif+JP:wght@200;300;400;500&family=Shippori+Mincho:wght@300;400;500;600&display=swap)" rel="stylesheet">
<style>
:root {
  --tiffany: #7DCFCA;
  --tiffany-mid: #5BBFB9;
  --tiffany-dark: #3DA8A1;
  --tiffany-light: #A8DDD9;
  --tiffany-pale: #E4F5F4;
  --tiffany-ultra: #F2FAFA;
  --pink-pale: #FDF0F3;
  --pink-soft: #FCE7EE;
  --lavender-pale: #F1F0FB;
  --white: #FFFFFF;
  --off-white: #FAFCFC;
  --text-dark: #1C2B2A;
  --text-mid: #3D5654;
  --text-light: #7A9C99;
  --text-xlight: #B0CECA;
  --border: rgba(125,207,202,0.25);
  --border-mid: rgba(125,207,202,0.45);
  --shadow-sm: 0 4px 20px rgba(61,168,161,0.10);
  --shadow: 0 8px 40px rgba(61,168,161,0.13);
  --shadow-lg: 0 20px 60px rgba(61,168,161,0.16);
  --radius: 16px;
  --radius-sm: 10px;
  --radius-lg: 26px;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  font-family: 'Noto Serif JP', serif;
  background: var(--white);
  color: var(--text-dark);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
img { max-width:100%; display:block; }
::-webkit-scrollbar { width:3px; }
::-webkit-scrollbar-track { background: var(--tiffany-ultra); }
::-webkit-scrollbar-thumb { background: var(--tiffany); border-radius:2px; }
/* ===== AGE GATE ===== */
#age-gate {
  position:fixed; inset:0;
  background:rgba(20,40,38,0.65);
  backdrop-filter:blur(12px);
  z-index:9999;
  display:flex; align-items:center; justify-content:center;
  padding:20px;
  transition:opacity 0.5s;
}
.age-card {
  background:white; border-radius:24px;
  padding:52px 40px 44px;
  max-width:400px; width:100%;
  text-align:center;
  box-shadow:0 32px 80px rgba(0,0,0,0.2);
}
.age-logo {
  font-family:'Cormorant Garamond',serif;
  font-size:2rem; font-weight:400;
  letter-spacing:0.08em; color:var(--text-dark);
  margin-bottom:4px;
}
.age-logo span { color:var(--tiffany-mid); }
.age-sub {
  font-size:0.72rem; letter-spacing:0.25em;
  color:var(--text-light); margin-bottom:32px;
}
.age-text {
  font-size:0.88rem; line-height:1.9;
  color:var(--text-mid); letter-spacing:0.04em;
  margin-bottom:36px;
}
.age-btns { display:flex; gap:12px; }
.age-yes,
.age-no {
  flex:1;
  border:none; border-radius:50px;
  padding:15px 20px;
  font-family:'Noto Serif JP',serif;
  font-size:0.85rem;
  letter-spacing:0.1em;
  cursor:pointer;
  transition:all 0.3s;
}
.age-yes {
  background:var(--tiffany-mid); color:white;
}
.age-yes:hover {
  background:var(--tiffany-dark); transform:translateY(-1px);
}
.age-no {
  background:#f3f4f6; color:#9ca3af;
}
.age-no:hover { background:#e5e7eb; }
/* ===== NAV ===== */
nav {
  position:fixed; top:0; left:0; right:0; z-index:100;
  background:rgba(255,255,255,0.93);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:0 20px; height:60px;
  display:flex; align-items:center; justify-content:space-between;
}
.nav-logo {
  font-family:'Cormorant Garamond',serif;
  font-size:1.4rem; font-weight:400;
  letter-spacing:0.1em; color:var(--text-dark); text-decoration:none;
}
.nav-logo span { color:var(--tiffany-mid); }
.nav-right { display:flex; align-items:center; gap:20px; }
.nav-links { display:flex; gap:22px; list-style:none; }
.nav-links a {
  font-size:0.7rem; letter-spacing:0.15em;
  color:var(--text-mid); text-decoration:none;
  transition:color 0.3s;
}
.nav-links a:hover { color:var(--tiffany-dark); }
.nav-btn {
  background:var(--tiffany-mid); color:white;
  border:none; border-radius:50px; padding:9px 20px;
  font-family:'Noto Serif JP',serif; font-size:0.75rem;
  letter-spacing:0.1em; cursor:pointer; text-decoration:none;
  transition:all 0.3s; white-space:nowrap;
}
.nav-btn:hover { background:var(--tiffany-dark); transform:translateY(-1px); }
@media(max-width:640px){
  .nav-links { display:none; }
  nav { padding:0 14px; }
  .nav-logo { font-size:1.2rem; }
  .nav-btn { padding:9px 18px; font-size:0.72rem; }
}
/* ===== HERO ===== */
#hero {
  min-height:100vh; padding-top:60px;
  background:
    radial-gradient(circle at 20% 25%, rgba(255,255,255,0.95), transparent 32%),
    radial-gradient(circle at 78% 70%, rgba(168,221,217,0.35), transparent 30%),
    linear-gradient(160deg,#FFFFFF 0%,#F5FBFB 50%,var(--tiffany-pale) 100%);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  position:relative; overflow:hidden;
  text-align:center; padding-left:24px; padding-right:24px;
}
.orb { position:absolute; border-radius:50%; pointer-events:none; }
.orb1 {
  width:600px;height:600px;top:-150px;right:-150px;
  background:radial-gradient(circle,rgba(125,207,202,0.10) 0%,transparent 70%);
}
.orb2 {
  width:400px;height:400px;bottom:-80px;left:-80px;
  background:radial-gradient(circle,rgba(125,207,202,0.08) 0%,transparent 70%);
}
.orb3 {
  width:200px;height:200px;top:30%;left:5%;
  background:radial-gradient(circle,rgba(249,215,227,0.35) 0%,transparent 70%);
}
.hero-logo-box {
  width:180px;height:180px;
  background:white; border-radius:20px;
  box-shadow:var(--shadow);
  display:flex; align-items:center; justify-content:center;
  margin:0 auto 36px; position:relative; z-index:2; overflow:hidden;
}
.hero-logo-box img { width:100%;height:100%;object-fit:cover; display:block; }
.logo-placeholder { text-align:center; }
.logo-placeholder .lt {
  font-family:'Cormorant Garamond',serif;
  font-size:2.1rem;font-weight:400;
  letter-spacing:0.08em;color:var(--text-dark);line-height:1;
}
.logo-placeholder .lt span { color:var(--tiffany-mid); }
.logo-placeholder .ls {
  font-size:0.6rem;letter-spacing:0.3em;
  color:var(--text-light);margin-top:6px;
}
.hero-catch {
  font-family:'Shippori Mincho','Noto Serif JP',serif;
  font-size:clamp(2rem,8vw,3.1rem);
  font-weight:400; letter-spacing:0.12em;
  color:var(--text-dark); margin-bottom:18px; line-height:1.45;
  position:relative; z-index:2;
}
.hero-sub {
  font-size:0.9rem; letter-spacing:0.08em;
  color:var(--text-mid); line-height:2; margin-bottom:8px;
  position:relative; z-index:2;
}
.hero-sub strong { color:var(--tiffany-dark); font-weight:400; }
.hero-sub2 {
  font-size:0.84rem; letter-spacing:0.08em;
  color:var(--text-light); margin-bottom:36px;
  position:relative; z-index:2;
}
.hero-badge {
  display:inline-flex; align-items:center; gap:8px;
  background:white; border:1px solid var(--border-mid);
  border-radius:50px; padding:8px 20px;
  font-size:0.74rem; letter-spacing:0.15em; color:var(--text-mid);
  margin-bottom:28px; position:relative; z-index:2;
  box-shadow:var(--shadow-sm);
}
.hero-badge::before { content:'✦'; color:var(--tiffany); font-size:0.6rem; }
.hero-btns {
  display:flex; flex-direction:column; gap:13px;
  align-items:center; position:relative; z-index:2;
  width:100%; max-width:320px; margin:0 auto;
}
.btn-main {
  display:flex; align-items:center; justify-content:center; gap:10px;
  width:100%; background:var(--tiffany-mid); color:white;
  border:none; border-radius:50px; padding:17px 32px;
  font-family:'Noto Serif JP',serif; font-size:0.88rem;
  letter-spacing:0.12em; text-decoration:none; cursor:pointer;
  transition:all 0.3s; box-shadow:0 8px 28px rgba(91,191,185,0.35);
}
.btn-main:hover {
  transform:translateY(-2px);
  box-shadow:0 12px 36px rgba(91,191,185,0.45);
}
.btn-sub {
  display:flex; align-items:center; justify-content:center;
  width:100%; background:rgba(255,255,255,0.85); color:var(--text-mid);
  border:1px solid var(--border-mid); border-radius:50px; padding:15px 32px;
  font-family:'Noto Serif JP',serif; font-size:0.84rem;
  letter-spacing:0.12em; cursor:pointer; transition:all 0.3s;
  text-decoration:none;
}
.btn-sub:hover { background:var(--tiffany-pale); border-color:var(--tiffany-mid); }
.hero-scroll {
  position:absolute; bottom:36px; left:50%; transform:translateX(-50%);
  display:flex; flex-direction:column; align-items:center; gap:6px;
  animation:sa 2.4s ease-in-out infinite;
}
.hero-scroll span {
  font-family:'Cormorant Garamond',serif;
  font-size:0.58rem; letter-spacing:0.45em; color:var(--text-xlight);
}
.scroll-line {
  width:1px;height:36px;
  background:linear-gradient(180deg,var(--tiffany-light),transparent);
}
@keyframes sa {
  0%,100% { transform:translateX(-50%) translateY(0);opacity:1; }
  50% { transform:translateX(-50%) translateY(-8px);opacity:0.6; }
}
/* ===== SECTIONS ===== */
section { position:relative; }
.section-shell {
  max-width:960px;
  margin:0 auto;
}
.section-label {
  display:flex; align-items:center; gap:10px;
  font-size:0.68rem; letter-spacing:0.35em; color:var(--tiffany-mid);
  text-transform:uppercase; margin-bottom:10px;
}
.section-label::before {
  content:'';
  display:block;width:28px;height:1px;background:var(--tiffany-mid);
}
.section-title {
  font-family:'Shippori Mincho','Noto Serif JP',serif;
  font-size:clamp(1.8rem,6vw,2.8rem); font-weight:400;
  letter-spacing:0.06em; color:var(--text-dark);
  margin-bottom:16px; line-height:1.45;
}
.section-desc {
  font-size:0.9rem; color:var(--text-mid);
  letter-spacing:0.04em; line-height:2.1;
}
/* ===== CONCEPT ===== */
#concept {
  padding:90px 24px;
  background:linear-gradient(180deg,#ffffff 0%, #ffffff 62%, #fbfefe 100%);
}
.concept-photo-grid {
  display:grid; grid-template-columns:1fr 1fr;
  gap:14px; margin:38px 0 34px; position:relative;
}
.cp {
  border-radius:24px; overflow:hidden;
  aspect-ratio:4/3;
  background:#eef7f6;
  box-shadow:var(--shadow-sm);
}
.cp img {
  width:100%; height:100%; object-fit:cover;
}
.cp3 {
  grid-column:1/-1; min-height:84px;
  background:linear-gradient(135deg,var(--pink-pale),#FDE8EE);
  border-radius:20px; display:flex;
  align-items:center; justify-content:space-between; padding:0 22px;
  font-size:0.78rem; letter-spacing:0.1em; color:var(--text-light);
}
.concept-badge-pill {
  position:absolute; left:22px; bottom:72px;
  background:white; border:1px solid var(--border-mid);
  border-radius:50px; padding:8px 16px;
  font-size:0.72rem; letter-spacing:0.12em; color:var(--text-mid);
  box-shadow:var(--shadow-sm); display:flex; align-items:center; gap:6px;
}
.concept-heading {
  font-family:'Shippori Mincho','Noto Serif JP',serif;
  font-size:clamp(1.55rem,6vw,2.1rem); font-weight:400;
  line-height:1.75; letter-spacing:0.05em; color:var(--text-dark);
  margin-bottom:18px;
}
.concept-heading em {
  color:var(--tiffany-mid); font-style:normal; font-weight:500;
}
.concept-body {
  font-size:0.92rem; line-height:2.15; color:var(--text-mid); letter-spacing:0.03em;
}
/* ===== PLAN ===== */
#plan { padding:90px 24px; background:#ffffff; }
.plan-list {
  display:flex; flex-direction:column; gap:22px; margin-top:34px;
}
.plan-card {
  border-radius:28px; padding:34px 26px; position:relative; overflow:hidden;
  box-shadow:var(--shadow-sm);
}
.plan-premium {
  background:linear-gradient(135deg,#ECFBFA 0%, #E8F7F5 100%);
  border:1px solid rgba(125,207,202,0.35);
}
.plan-normal {
  background:linear-gradient(135deg,#FFF3F6 0%, #FDEBF1 100%);
  border:1px solid rgba(249,180,200,0.35);
}
.plan-badge {
  display:inline-flex; align-items:center; gap:8px;
  border-radius:999px; padding:8px 18px;
  font-size:0.74rem; letter-spacing:0.18em; margin-bottom:18px;
}
.plan-premium .plan-badge {
  background:rgba(125,207,202,0.18);
  border:1px solid rgba(125,207,202,0.35);
  color:var(--tiffany-dark);
}
.plan-normal .plan-badge {
  background:rgba(249,180,200,0.18);
  border:1px solid rgba(249,180,200,0.35);
  color:#bf6f8a;
}
.plan-name {
  font-family:'Shippori Mincho','Noto Serif JP',serif;
  font-size:1.75rem; font-weight:400;
  letter-spacing:0.05em; color:var(--text-dark); margin-bottom:8px;
}
.plan-sub {
  font-size:0.88rem; color:var(--text-light);
  letter-spacing:0.04em; line-height:1.9; margin-bottom:24px;
}
.plan-price {
  font-family:'Cormorant Garamond',serif;
  font-size:3.2rem; font-weight:400;
  color:var(--text-dark); letter-spacing:0.02em; line-height:1; margin-bottom:10px;
}
.plan-time-tag {
  display:inline-flex; align-items:center; gap:6px;
  background:rgba(255,255,255,0.88); border-radius:999px;
  padding:7px 16px; font-size:0.8rem; letter-spacing:0.1em;
  color:var(--text-mid); margin-bottom:20px;
}
.plan-items { list-style:none; }
.plan-items li {
  font-size:0.9rem; color:var(--text-mid); letter-spacing:0.03em;
  padding:6px 0; display:flex; align-items:flex-start; gap:10px;
  line-height:1.9;
}
.plan-items li::before {
  content:'—'; color:var(--tiffany-light); font-size:0.8rem; padding-top:2px;
}
.plan-normal .plan-items li::before { color:#f0b0c0; }
.plan-deco {
  position:absolute; top:20px; right:22px; font-size:1.6rem; opacity:0.45;
}
/* ===== RULES ===== */
#rules {
  padding:90px 24px;
  background:linear-gradient(180deg,#F6FCFB 0%, #EEF9F8 100%);
}
.rules-card {
  background:white; border-radius:26px;
  padding:28px 22px; box-shadow:var(--shadow-sm); margin-top:24px;
}
.rules-intro {
  font-size:0.88rem; color:var(--text-mid); line-height:2.15;
  letter-spacing:0.03em; padding-bottom:18px; margin-bottom:10px;
  border-bottom:1px solid var(--border);
}
.rule-row {
  display:flex; align-items:flex-start; gap:14px;
  padding:14px 0; border-bottom:1px solid rgba(125,207,202,0.10);
}
.rule-row:last-child { border-bottom:none; }
.rule-icon {
  width:42px;height:42px; border-radius:14px;
  background:var(--pink-pale); display:flex; align-items:center;
  justify-content:center; font-size:1.15rem; flex-shrink:0;
}
.rule-text {
  font-size:0.9rem; letter-spacing:0.03em; color:var(--text-mid); line-height:1.8;
  padding-top:2px;
}
/* ===== SNS ===== */
#sns { padding:90px 24px; background:#ffffff; }
.sns-list { display:flex; flex-direction:column; gap:18px; margin-top:32px; }
.sns-card {
  border-radius:26px; padding:24px 20px;
  text-decoration:none; transition:transform 0.3s,box-shadow 0.3s; display:block;
  box-shadow:var(--shadow-sm);
}
.sns-card:hover { transform:translateY(-3px); box-shadow:var(--shadow); }
.sns-ig {
  background:linear-gradient(135deg,#FFF3F6 0%,#FDEBF1 100%);
  border:1px solid rgba(220,100,150,0.18);
}
.sns-tw {
  background:linear-gradient(135deg,#ECFBFA 0%,#F8FFFF 100%);
  border:1px solid rgba(125,207,202,0.25);
}
.sns-tk {
  background:linear-gradient(135deg,#F4F3FF 0%,#EEEFFC 100%);
  border:1px solid rgba(100,100,180,0.14);
}
.sns-top { display:flex; align-items:center; gap:14px; margin-bottom:14px; }
.sns-icon {
  width:56px;height:56px; border-radius:18px;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0; font-size:1.1rem; color:#fff;
}
.sns-ig .sns-icon {
  background:linear-gradient(135deg,#f09433 0%,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%);
}
.sns-tw .sns-icon { background:#1da1f2; }
.sns-tk .sns-icon { background:#010101; }
.sns-pname {
  font-family:'Cormorant Garamond',serif; font-size:1.3rem;
  letter-spacing:0.06em; color:var(--text-dark); font-weight:500;
}
.sns-handle {
  font-size:0.76rem; letter-spacing:0.04em; color:var(--text-light); margin-top:2px;
}
.sns-body {
  font-size:0.88rem; color:var(--text-mid); line-height:2; letter-spacing:0.03em; margin-bottom:14px;
}
.sns-hl {
  font-weight:500; display:block; margin-top:4px;
}
.sns-ig .sns-hl { color:#c0306a; }
.sns-tw .sns-hl { color:var(--tiffany-dark); }
.sns-tk .sns-hl { color:#5555b5; }
.sns-btn {
  display:inline-flex; align-items:center; gap:8px;
  border-radius:999px; padding:9px 18px;
  font-size:0.76rem; letter-spacing:0.08em;
  border:none; cursor:pointer; transition:all 0.3s;
  font-family:'Noto Serif JP',serif;
}
.sns-ig .sns-btn { background:rgba(192,48,106,0.10); color:#c0306a; }
.sns-tw .sns-btn { background:rgba(125,207,202,0.16); color:var(--tiffany-dark); }
.sns-tk .sns-btn { background:rgba(80,80,176,0.10); color:#5050b0; }
/* ===== ACCESS ===== */
#access {
  padding:90px 24px;
  background:linear-gradient(180deg,#F6FCFB 0%, #EEF9F8 100%);
}
.access-list { display:flex; flex-direction:column; gap:12px; margin-top:30px; }
.access-row {
  background:white; border-radius:20px;
  padding:18px 18px; display:flex; align-items:flex-start;
  gap:14px; box-shadow:var(--shadow-sm);
}
.access-icon {
  width:46px;height:46px; background:var(--tiffany-pale);
  border-radius:16px; display:flex; align-items:center;
  justify-content:center; font-size:1.2rem; flex-shrink:0;
}
.access-label {
  font-size:0.72rem; letter-spacing:0.15em; color:var(--tiffany-dark);
  margin-bottom:4px; font-weight:500;
}
.access-val {
  font-size:0.92rem; color:var(--text-mid); letter-spacing:0.03em; line-height:1.9;
}
.access-val a { color:var(--tiffany-dark); text-decoration:none; }
.access-map {
  border-radius:26px; overflow:hidden;
  margin-top:18px; box-shadow:var(--shadow-sm);
  height:280px; border:1px solid var(--border);
}
.access-map iframe { width:100%;height:100%;border:none;display:block; }
/* ===== RESERVE CTA ===== */
#reserve-cta {
  padding:88px 24px;
  background:linear-gradient(160deg,var(--tiffany-mid) 0%,var(--tiffany-dark) 100%);
  text-align:center; position:relative; overflow:hidden;
}
#reserve-cta::before {
  content:'46'; position:absolute;
  font-family:'Cormorant Garamond',serif;
  font-size:42vw; font-weight:300;
  color:rgba(255,255,255,0.04);
  top:50%;left:50%; transform:translate(-50%,-50%);
  pointer-events:none; line-height:1; letter-spacing:-0.05em;
}
.cta-title {
  font-family:'Shippori Mincho','Noto Serif JP',serif;
  font-size:clamp(1.5rem,5vw,2.2rem); font-weight:400;
  color:white; letter-spacing:0.08em; margin-bottom:10px; line-height:1.5;
  position:relative; z-index:1;
}
.cta-sub {
  font-family:'Cormorant Garamond',serif; font-style:italic;
  font-size:0.92rem; letter-spacing:0.15em;
  color:rgba(255,255,255,0.76); margin-bottom:36px;
  position:relative; z-index:1;
}
.btn-white {
  display:inline-flex; align-items:center; gap:10px;
  background:white; color:var(--tiffany-dark);
  border-radius:50px; padding:17px 42px;
  font-family:'Noto Serif JP',serif; font-size:0.88rem;
  letter-spacing:0.12em; text-decoration:none; transition:all 0.3s;
  box-shadow:0 8px 28px rgba(0,0,0,0.15);
  position:relative; z-index:1;
}
.btn-white:hover { transform:translateY(-3px); box-shadow:0 16px 40px rgba(0,0,0,0.2); }
/* ===== RECRUIT ===== */
#recruit {
  padding:90px 24px; background:#ffffff; text-align:center;
}
